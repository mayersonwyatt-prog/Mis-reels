name: Render reel
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts Reel out/reel.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
